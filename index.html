
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL CD Browser</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d121b;color:#eee;font-family:Arial,sans-serif;padding:22px}
.container{max-width:1100px;margin:auto}
h1{color:#c8aa6e}
h2{font-size:19px}
.panel{background:#172231;border:1px solid #34445a;border-radius:12px;padding:18px;margin:15px 0}
input,select{background:#0d1724;color:white;border:1px solid #46566c;border-radius:7px;padding:10px;width:100%;min-width:0}
label{display:block;font-size:13px;color:#aebdce;margin-bottom:5px}
button{background:#24374d;color:white;border:1px solid #52647a;padding:7px 12px;border-radius:6px;cursor:pointer}
button:hover{background:#36516d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.champ{background:#172231;border:1px solid #34445a;border-radius:12px;padding:15px;min-width:0}
.champhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.portrait{width:65px;height:65px;border-radius:8px}
.skill{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #34445a}
.skill:last-child{border:0}
.skill img{width:46px;height:46px;border-radius:7px}
.skillinfo{flex:1;min-width:0}
.skillname{font-weight:bold}
.muted{color:#98a9bc;font-size:12px}
.cd{font-size:20px;font-weight:bold;color:#e8c879;text-align:right;white-space:nowrap}
.small{font-size:11px;color:#9babc0}
.level{width:65px;padding:5px}
.special-mode{width:auto;max-width:100%;padding:6px;margin-top:4px}
.spell{display:flex;align-items:center;gap:10px}
.spell img{width:40px;height:40px}
.row{display:flex;gap:12px;align-items:center}
.row>*{flex:1}
.status{color:#9db6d1;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}.row{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="container">

<h1>⚔ LoL Skill CD Browser</h1>
<p class="muted" id="patch">データ読み込み中...</p>
<p class="status" id="status">Data Dragonに接続しています...</p>

<div class="panel">
<h2>🔍 チャンピオン検索</h2>
<label>検索（日本語・英語）</label>
<input id="search" placeholder="例：アーリ / Ahri">

<div class="row" style="margin-top:12px">
<div>
<label>チャンピオン①</label>
<select id="champ1"></select>
</div>
<div>
<label>チャンピオン②</label>
<select id="champ2"></select>
</div>
</div>

<label style="margin-top:12px">
<input type="checkbox" id="compare" style="width:auto">
2体を比較する
</label>
</div>

<div class="panel">
<h2>⚙ クールタイム計算設定</h2>
<div class="row">
<div>
<label>基本Ability Haste</label>
<input id="haste" type="number" min="0" max="500" value="0">
</div>
<div>
<label>追加Ability Haste</label>
<input id="extra" type="number" min="0" max="500" value="0">
</div>
</div>

<div style="margin-top:15px">
<label>
<input id="runeAH" type="checkbox" style="width:auto">
ルーン：スキルヘイスト +8
</label>
<label>
<input id="runeSS" type="checkbox" style="width:auto">
ルーン：サモナースペルヘイスト +18（Cosmic Insight）
</label>
</div>

<div class="muted" style="margin-top:10px">
スキルヘイスト合計：<strong id="totalAH">0</strong> AH
<br>
サモナースペルヘイスト：<strong id="totalSS">0</strong>
</div>
</div>

<div id="results" class="grid"></div>

<div class="panel">
<h2>✨ Summoner Spells</h2>
<div class="row">
<div>
<label>スペル①</label>
<select id="sum1"></select>
<div id="sumResult1" class="spell" style="margin-top:10px"></div>
</div>
<div>
<label>スペル②</label>
<select id="sum2"></select>
<div id="sumResult2" class="spell" style="margin-top:10px"></div>
</div>
</div>
<p class="muted">
基本CDとサモナースペルヘイスト適用後のCDを表示します。
</p>
</div>

<p class="muted" style="text-align:center">
Data source: Riot Games Data Dragon
</p>
</div>

<script>
const BASE="https://ddragon.leagueoflegends.com";

let version="";
let champions=[];
let summoners=[];
let cache={};

const $=id=>document.getElementById(id);

const state={levels:{},specialModes:{}};

function totalAH(){
 return Math.max(0,Number($("haste").value)||0)
 +Math.max(0,Number($("extra").value)||0)
 +($("runeAH").checked?8:0);
}

function totalSS(){
 return $("runeSS").checked?18:0;
}

function calculateCD(base,haste){
 return Number(base)/(1+haste/100);
}

function formatCD(n){
 return Number(n).toFixed(2)+"秒";
}

function championImage(id){
 return `${BASE}/cdn/${version}/img/champion/${id}.png`;
}

function spellImage(name){
 return `${BASE}/cdn/${version}/img/spell/${name}`;
}

async function init(){
 try{
  const versions=await fetch(
   `${BASE}/api/versions.json`
  ).then(r=>r.json());

  version=versions[0];
  $("patch").textContent="Patch "+version;

  const [champData,sumData]=await Promise.all([
   fetch(`${BASE}/cdn/${version}/data/ja_JP/champion.json`).then(r=>r.json()),
   fetch(`${BASE}/cdn/${version}/data/ja_JP/summoner.json`).then(r=>r.json())
  ]);

  champions=Object.values(champData.data);
  summoners=Object.values(sumData.data);

  champions.sort((a,b)=>a.name.localeCompare(b.name,"ja"));

  showChampions();

  // 初期チャンピオン
  const ahri=champions.find(c=>c.id==="Ahri");
  if(ahri)$("champ1").value="Ahri";

  const yasuo=champions.find(c=>c.id==="Yasuo");
  if(yasuo)$("champ2").value="Yasuo";

  showSummoners();
  await render();

  $("status").textContent=
   champions.length+"体のチャンピオンを読み込みました！ 特殊CD条件データは登録済みのスキルのみ個別計算します。";

 }catch(e){
  console.error(e);
  $("status").textContent=
   "データ取得失敗。ネット接続を確認してください。";
 }
}


function showChampions(){
 const keyword=$("search").value.toLowerCase();

 // チャンピオン①だけ検索で絞り込む
 const filtered=champions.filter(c=>
  (c.name+" "+c.id+" "+c.title)
  .toLowerCase().includes(keyword)
 );

 const old1=$("champ1").value;
 const old2=$("champ2").value;

 // チャンピオン①：検索結果
 $("champ1").innerHTML=filtered.map(c=>
  `<option value="${c.id}">${c.name}</option>`
 ).join("");

 // チャンピオン②：常に全員から選択可能
 $("champ2").innerHTML=champions.map(c=>
  `<option value="${c.id}">${c.name}</option>`
 ).join("");

 // 選択状態を維持
 if(filtered.some(c=>c.id===old1)){
  $("champ1").value=old1;
 }else if(filtered.length){
  $("champ1").value=filtered[0].id;
 }

 if(champions.some(c=>c.id===old2)){
  $("champ2").value=old2;
 }
}

async function getChampion(id){
 if(cache[id])return cache[id];

 const data=await fetch(
  `${BASE}/cdn/${version}/data/ja_JP/champion/${id}.json`
 ).then(r=>r.json());

 cache[id]=data.data[id];
 return cache[id];
}

function getLevel(id,slot){
 const key=id+"_"+slot;
 return state.levels[key]||1;
}

function getEzrealHits(){
 return Math.max(0,Number(state.specialModes["Ezreal_Q_hits"])||0);
}

function setLevel(id,slot,value){
 const max=slot==="R"?3:5;
 state.levels[id+"_"+slot]=Math.max(1,Math.min(max,value));
}

// 特殊CDルール台帳。新しいチャンピオンの仕様はここに追加していく。
// status: "implemented" = 条件別計算を実装済み
// status: "unverified" = 特殊仕様の確認待ち
const SPECIAL_CD_RULES={
 "Pantheon_Q":{status:"implemented",type:"cast_mode",label:"短押し / 長押し"},
 "Diana_E":{status:"implemented",type:"moonlight_reset",label:"月光あり / なし"},
 // Kai'Sa W：進化後、敵チャンピオンに命中するとCDを75%返還
 "Kaisa_W":{status:"implemented",type:"champion_hit_refund",refund:0.75,label:"進化後・チャンピオン命中"},
 // Ezreal Q：敵に命中すると全スキルの現在CDを1.5秒短縮
 "Ezreal_Q":{status:"implemented",type:"flat_refund",refund:1.5,label:"Q命中時に全スキルCDを短縮"},
 // Thresh Q：敵に命中するとQの現在CDを2秒短縮
 "Thresh_Q":{status:"implemented",type:"flat_refund",refund:2,label:"敵に命中でQのCDを2秒短縮"}
};

function getSpecialRule(id,slot){
 return SPECIAL_CD_RULES[id+"_"+slot] || null;
}

function getSpecialMode(id,slot){
 const rule=getSpecialRule(id,slot);
 if(!rule)return null;
 if(id==="Pantheon"&&slot==="Q")return "pantheonQ";
 if(id==="Diana"&&slot==="E")return "dianaE";
 if(id==="Kaisa"&&slot==="W")return "kaisaW";
 return null;
}

function getSpecialModeValue(id,slot){
 const key=id+"_"+slot;
 return state.specialModes[key] || "normal";
}

function specialCooldown(id,slot,base,haste){
 const mode=getSpecialMode(id,slot);
 const value=getSpecialModeValue(id,slot);

 if(mode==="pantheonQ"&&value==="tap"){
  // 短押しはクールタイムを60%返還＝通常CDの40%
  return calculateCD(base*0.4,haste);
 }
 if(mode==="dianaE"&&value==="moonlight"){
  // マーク付きに使用した場合、現在のCDは0.25秒まで短縮
  return 0.25;
 }
 if(mode==="kaisaW"&&value==="evolvedHit"){
  // 進化後Wが敵チャンピオンに命中：CDの75%を返還
  return calculateCD(base*(1-0.75),haste);
 }
 let result=calculateCD(base,haste);
 if(id==="Thresh"&&slot==="Q"&&value==="hit"){
  // Qが敵に命中すると、現在CDを2秒短縮
  result=Math.max(0,result-2);
 }
 // Ezreal Q命中時は、Q自身を含む全スキルの現在CDを1.5秒短縮。
 // UIで指定した命中回数分を、AH適用後のCDから差し引く概算表示。
 if(id==="Ezreal"){
  const hits=Math.max(0,Number(state.specialModes["Ezreal_Q_hits"])||0);
  result=Math.max(0,result-(1.5*hits));
 }
 return result;
}

function createChampionCard(c){
 const id=c.id;
 const h=totalAH();

 let html=`
 <div class="champ">
 <div class="champhead">
 <img class="portrait" src="${championImage(id)}">
 <div>
 <h2>${c.name}</h2>
 <div class="muted">${c.title}</div>
 <div class="muted">${(c.tags||[]).join(" / ")}</div>
 </div>
 </div>
 <h3>スキルクールタイム</h3>
 <div class="small" style="margin-bottom:10px">特殊CDの条件データが未登録のスキルは、通常CDを表示し「特殊CD情報未登録」と表示します。未登録は特殊効果があると断定するものではありません。</div>
 ${id==="Ezreal"?`<div style="margin:8px 0 12px"><label>Qの命中回数（敵に命中するたび全スキルCDを1.5秒短縮）</label><select class="special-mode" data-champ="Ezreal" data-slot="Q_hits"><option value="0" ${getEzrealHits()===0?"selected":""}>0回</option><option value="1" ${getEzrealHits()===1?"selected":""}>1回</option><option value="2" ${getEzrealHits()===2?"selected":""}>2回</option><option value="3" ${getEzrealHits()===3?"selected":""}>3回</option><option value="4" ${getEzrealHits()===4?"selected":""}>4回</option><option value="5" ${getEzrealHits()===5?"selected":""}>5回</option></select><div class="small">※実戦の残りCDを再現するものではなく、命中回数に応じた目安です。</div></div>`:""}
 `;

 ["Q","W","E","R"].forEach((slot,i)=>{
  const s=c.spells[i];
  const level=getLevel(id,slot);
  const max=slot==="R"?3:5;
  const base=Number(s.cooldown[level-1]||0);
  const special=getSpecialMode(id,slot);
  const rule=getSpecialRule(id,slot);
  const modeValue=getSpecialModeValue(id,slot);
  const actual=specialCooldown(id,slot,base,h);
  const specialStatus=rule && rule.status==="implemented"
   ? `<div class="small" style="color:#8fd3a8;margin-top:4px">特殊CD：条件別計算に対応</div>`
   : id==="Ezreal"
    ? `<div class="small" style="color:#8fd3a8;margin-top:4px">Q命中時の全スキルCD短縮を反映</div>`
    : `<div class="small" style="color:#e8c879;margin-top:4px">特殊CD情報未登録（通常CDで計算）</div>`;

  let specialControl="";
  if(special==="pantheonQ"){
   specialControl=`
    <div style="margin-top:7px">
     <span class="small">使用方法</span>
     <select class="special-mode" data-champ="${id}" data-slot="${slot}">
      <option value="tap" ${modeValue==="tap"?"selected":""}>短押し（CD 60%返還）</option>
      <option value="normal" ${modeValue==="normal"?"selected":""}>長押し・投げる（通常CD）</option>
     </select>
    </div>`;
  }else if(special==="dianaE"){
   specialControl=`
    <div style="margin-top:7px">
     <span class="small">対象の状態</span>
     <select class="special-mode" data-champ="${id}" data-slot="${slot}">
      <option value="normal" ${modeValue==="normal"?"selected":""}>月光なし（通常CD）</option>
      <option value="moonlight" ${modeValue==="moonlight"?"selected":""}>月光あり（0.25秒）</option>
     </select>
    </div>`;
  }else if(special==="kaisaW"){
   specialControl=`
    <div style="margin-top:7px">
     <span class="small">Wの状態</span>
     <select class="special-mode" data-champ="${id}" data-slot="${slot}">
      <option value="normal" ${modeValue==="normal"?"selected":""}>未進化 / 命中なし（通常CD）</option>
      <option value="evolvedHit" ${modeValue==="evolvedHit"?"selected":""}>進化後Wが敵チャンピオンに命中（CD75%返還）</option>
     </select>
    </div>`;
  }else if(id==="Thresh"&&slot==="Q"){
   specialControl=`
    <div style="margin-top:7px">
     <span class="small">Qの命中状態</span>
     <select class="special-mode" data-champ="${id}" data-slot="${slot}">
      <option value="normal" ${modeValue==="normal"?"selected":""}>敵に命中していない（通常CD）</option>
      <option value="hit" ${modeValue==="hit"?"selected":""}>敵に命中（CDを2秒短縮）</option>
     </select>
    </div>`;
  }

  html+=`
  <div class="skill">
   <img src="${spellImage(s.image.full)}">
   <div class="skillinfo">
    <div class="skillname">${slot} - ${s.name}</div>
    <div class="muted">基本CD：${base}秒</div>
    ${specialStatus}
    <div style="margin-top:7px">
     <span class="small">スキルLv</span>
     <select class="level" data-champ="${id}" data-slot="${slot}">
      ${Array.from({length:max},(_,i)=>
       `<option value="${i+1}" ${level===i+1?"selected":""}>${i+1}</option>`
      ).join("")}
     </select>
    </div>
    ${specialControl}
   </div>
   <div class="cd">
    ${formatCD(actual)}
    <div class="small">CD</div>
   </div>
  </div>`;
 });

 html+=`</div>`;
 return html;
}

async function render(){
 const ids=[$("champ1").value];

 if($("compare").checked&&$("champ2").value){
  ids.push($("champ2").value);
 }

 const unique=[...new Set(ids.filter(Boolean))];

 if(!unique.length)return;

 $("results").innerHTML="<div class='panel'>読み込み中...</div>";

 try{
  const data=await Promise.all(unique.map(getChampion));
  $("results").innerHTML=data.map(createChampionCard).join("");
  $("totalAH").textContent=totalAH();
  $("totalSS").textContent=totalSS();
 }catch(e){
  $("results").textContent="チャンピオンの取得に失敗しました。";
 }
}

function showSummoners(){
 const classic=summoners.filter(s=>
  !s.modes||s.modes.includes("CLASSIC")
 );

 const options=classic.map(s=>
  `<option value="${s.id}">${s.name}</option>`
 ).join("");

 $("sum1").innerHTML=options;
 $("sum2").innerHTML=options;

 const flash=classic.find(s=>s.id==="SummonerFlash");
 const teleport=classic.find(s=>s.id==="SummonerTeleport");

 if(flash)$("sum1").value=flash.id;
 if(teleport)$("sum2").value=teleport.id;

 renderSummoners();
}

function renderSummoners(){
 ["sum1","sum2"].forEach((selectId,i)=>{
  const s=summoners.find(x=>x.id===$(selectId).value);
  const target=$("sumResult"+(i+1));

  if(!s){
   target.textContent="データなし";
   return;
  }

  const base=Number(s.cooldown||0);
  const actual=calculateCD(base,totalSS());

  target.innerHTML=`
   <img src="${BASE}/cdn/${version}/img/spell/${s.image.full}">
   <div>
    <strong>${s.name}</strong>
    <div class="muted">基本CD：${base}秒</div>
    <div style="color:#e8c879;font-weight:bold">
     ${formatCD(actual)}
    </div>
   </div>`;
 });
}

$("search").addEventListener("input",()=>{
 showChampions();
 render();
});

$("champ1").addEventListener("change",render);
$("champ2").addEventListener("change",render);
$("compare").addEventListener("change",render);

["haste","extra","runeAH","runeSS"].forEach(id=>{
 $(id).addEventListener("input",()=>{
  $("totalAH").textContent=totalAH();
  $("totalSS").textContent=totalSS();
  render();
  renderSummoners();
 });
 $(id).addEventListener("change",()=>{
  $("totalAH").textContent=totalAH();
  $("totalSS").textContent=totalSS();
  render();
  renderSummoners();
 });
});

$("sum1").addEventListener("change",renderSummoners);
$("sum2").addEventListener("change",renderSummoners);

$("results").addEventListener("change",e=>{
 if(e.target.matches(".level")){
  setLevel(
   e.target.dataset.champ,
   e.target.dataset.slot,
   Number(e.target.value)
  );
  render();
  return;
 }

 if(e.target.matches(".special-mode")){
  const key=e.target.dataset.champ+"_"+e.target.dataset.slot;
  state.specialModes[key]=e.target.value;
  render();
 }
});

init();
</script>
</body>
</html>
